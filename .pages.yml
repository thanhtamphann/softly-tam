media:
  - name: blog_images
    label: Blog images
    input: assets/images
    output: /softly-tam/assets/images
    extensions: [jpg, jpeg, png, webp, gif, svg]
    categories: [image]
    rename: safe

content:
  - name: website
    label: Website content
    type: file
    path: content/site.json
    format: json
    fields:
      - name: site
        label: Brand, introduction & contact
        type: object
        fields:
          - { name: name, label: Website name, type: string, required: true }
          - { name: authorName, label: Author name, type: string, default: Tam Phan, description: Used on every article and in the footer when a post author is left blank. }
          - name: logoImage
            label: Website logo
            type: image
            description: Optional. Upload a logo to replace the default S mark in the header and footer. Delete/clear it any time to return to the default mark.
            options:
              media: blog_images
              extensions: [jpg, jpeg, png, webp, svg]
              rename: safe
          - name: favicon
            label: Browser tab icon / favicon
            type: image
            description: Optional. Upload a square icon. Clear it any time to use the default Softly, Tam S icon.
            options:
              media: blog_images
              extensions: [jpg, jpeg, png, webp, svg]
              rename: safe
          - { name: heroEyebrow, label: Small line above heading, type: string }
          - { name: heroTitle, label: Main heading, type: text, required: true }
          - { name: heroIntro, label: Short introduction, type: text, required: true }
          - name: profileImage
            label: Your portrait
            type: image
            options:
              media: blog_images
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - { name: aboutTitle, label: About heading, type: text }
          - name: aboutBody
            label: About paragraphs
            type: text
            list: true
          - { name: contactText, label: Contact section message, type: text }
          - { name: newsletterTitle, label: Newsletter heading, type: string }
          - { name: newsletterText, label: Newsletter description, type: text }
          - { name: newsletterUrl, label: Newsletter signup URL, type: string, description: Add your Substack, Mailchimp or Buttondown signup link. Leave blank to show Coming soon. }
          - { name: footerTagline, label: Footer tagline, type: string }
          - { name: email, label: Contact form recipient email, type: string, description: Messages submitted through the website contact form are sent to this address. }
          - name: contactChannels
            label: Contact & social channels
            type: object
            description: Add any contact channel without editing code. Examples: Telegram, Facebook, Instagram, TikTok, Messenger, WhatsApp, LinkedIn, YouTube, Discord, Threads, email or your own community. Leave URL blank or disable an item to hide it.
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - { name: label, label: Channel name, type: string, required: true }
              - { name: icon, label: Icon / short symbol, type: string, description: Optional. Examples: ✈ for Telegram, ◎ for Instagram, ▶ for YouTube, in for LinkedIn. }
              - { name: url, label: Link, type: string, description: Full https link. mailto: and tel: links are also supported. }
              - { name: note, label: Short note / username, type: string, description: Optional text such as @yourname or Response within 24h. }
              - { name: enabled, label: Show this channel, type: boolean, default: true }
              - { name: showInContact, label: Show in Contact section, type: boolean, default: true }
              - { name: showInFooter, label: Show in footer, type: boolean, default: true }
              - { name: newTab, label: Open in new tab, type: boolean, default: true }
      - name: topics
        label: Topics
        type: object
        description: Add, edit, delete or reorder topics. Posts use the category value you choose in each post.
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - { name: name, label: Topic name, type: string, required: true }
          - { name: icon, label: Small symbol, type: string }
          - { name: note, label: Short description, type: string }
          - name: color
            label: Topic accent color
            type: select
            options:
              values:
                - { name: "#f2c98c", label: Warm Gold }
                - { name: "#b9cdb7", label: Sage Green }
                - { name: "#e7afa8", label: Blush Pink }
                - { name: "#b8c9db", label: Soft Blue }
                - { name: "#cbb9d9", label: Lavender }
                - { name: "#f0b99b", label: Peach }
                - { name: "#add8c5", label: Mint }
                - { name: "#d7a1af", label: Dusty Rose }
                - { name: "#f3d97e", label: Butter Yellow }
                - { name: "#c96f58", label: Terracotta }
      - name: posts
        label: Journal posts
        type: object
        description: Add a post with Add item. Open any existing post to edit it, use the trash button to delete it, or drag posts to reorder them. The website calculates reading time automatically from the article text. Only one post should be marked Featured.
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: slug
            label: URL slug
            type: string
            description: Use lowercase English words separated by hyphens, for example my-new-story. Keep this unique.
            required: true
          - { name: title, label: Title, type: string, required: true }
          - { name: author, label: Author, type: string, default: Tam Phan }
          - name: category
            label: Category
            type: string
            description: Enter the topic name exactly as it appears in Topics, for example Self-Care or Money. This keeps topics flexible so you can add new ones later.
            required: true
          - name: date
            label: Published date
            type: date
            description: New posts can use today's date; you can also change it before or after publishing.
            options:
              format: yyyy-MM-dd
          - name: readTime
            label: Reading time
            type: string
            hidden: true
            description: Calculated automatically from the article content on the website.
          - { name: excerpt, label: Card summary, type: text, required: true }
          - { name: seoDescription, label: Google and social description, type: text }
          - { name: lead, label: Opening sentence, type: text }
          - { name: quote, label: Highlighted quote, type: text }
          - name: tags
            label: Search tags
            type: string
            list: true
          - name: body
            label: Legacy paragraphs
            type: text
            list: true
            description: Existing older posts use this field. For new posts, use the rich content editor below.
          - name: content
            label: Article content — add text and images here
            type: rich-text
            description: Write and format the full article here. Use the image button inside the editor to upload images anywhere in the article.
            options:
              format: html
              switcher: true
              media: blog_images
              extensions: [jpg, jpeg, png, webp, gif]
              rename: safe
          - name: image
            label: Cover image
            type: image
            options:
              media: blog_images
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: color
            label: Article accent color
            type: select
            description: Used for the card, cover placeholder and article accents.
            options:
              values:
                - { name: "#f2c98c", label: Warm Gold }
                - { name: "#b9cdb7", label: Sage Green }
                - { name: "#e7afa8", label: Blush Pink }
                - { name: "#b8c9db", label: Soft Blue }
                - { name: "#cbb9d9", label: Lavender }
                - { name: "#f0b99b", label: Peach }
                - { name: "#add8c5", label: Mint }
                - { name: "#d7a1af", label: Dusty Rose }
                - { name: "#f3d97e", label: Butter Yellow }
                - { name: "#c96f58", label: Terracotta }
          - { name: featured, label: Featured post, type: boolean }
