media:
  - name: media
    label: Media Library
    input: assets/images
    output: /softly-tam/assets/images
    extensions: [jpg, jpeg, png, webp, gif, svg, pdf]
    categories: [image, document]
    rename: safe

content:
  - name: control
    label: 01 Website Control Center
    type: file
    path: content/control.json
    format: json
    fields:
      - name: site
        label: Site Settings
        type: object
        fields:
          - { name: name, label: Website name, type: string, required: true }
          - { name: authorName, label: Author name, type: string }
          - { name: tagline, label: Footer tagline, type: string }
          - name: logoImage
            label: Website logo
            type: image
            options: { media: media, extensions: [jpg, jpeg, png, webp, svg], rename: safe }
          - name: favicon
            label: Browser tab icon / favicon
            type: image
            options: { media: media, extensions: [jpg, jpeg, png, webp, svg], rename: safe }
          - name: profileImage
            label: Profile image
            type: image
            options: { media: media, extensions: [jpg, jpeg, png, webp], rename: safe }
          - { name: email, label: Main email, type: string }
          - name: cvPdf
            label: Resume / CV PDF
            type: file
            options: { media: media, extensions: [pdf], rename: safe }
          - name: defaultLanguage
            label: Default language
            type: select
            options:
              values: [en, vi]
      - name: announcement
        label: Announcement Bar
        type: object
        fields:
          - { name: enabled, label: Show announcement, type: boolean }
          - { name: text, label: Message, type: string }
          - { name: linkLabel, label: Link label, type: string }
          - { name: url, label: Link, type: string }
          - { name: newTab, label: Open in new tab, type: boolean }
      - name: menu
        label: Navigation Menu
        type: object
        description: Add, delete or drag items to reorder the menu.
        list:
          collapsible: { collapsed: true, summary: "{label}" }
        fields:
          - { name: label, label: Menu label, type: string, required: true }
          - { name: url, label: Link, type: string, required: true }
          - { name: enabled, label: Show item, type: boolean, default: true }
          - { name: newTab, label: Open in new tab, type: boolean }
      - name: ctaButtons
        label: Global CTA Buttons
        type: object
        list:
          collapsible: { collapsed: true, summary: "{label}" }
        fields:
          - { name: label, label: Button text, type: string, required: true }
          - { name: url, label: Link, type: string, required: true }
          - name: style
            label: Style
            type: select
            options:
              values: [primary, secondary, text]
          - { name: enabled, label: Show button, type: boolean, default: true }
          - { name: newTab, label: Open in new tab, type: boolean }
      - name: homepage
        label: Homepage
        type: object
        fields:
          - { name: heroEyebrow, label: Hero eyebrow, type: string }
          - { name: heroTitle, label: Hero title, type: text }
          - { name: heroIntro, label: Hero introduction, type: text }
          - name: sections
            label: Homepage sections
            type: object
            description: Drag to reorder. Toggle Enabled to show/hide a section.
            list:
              collapsible: { collapsed: true, summary: "{label}" }
            fields:
              - { name: id, label: Section ID, type: string, readonly: true }
              - { name: label, label: Admin label, type: string }
              - { name: enabled, label: Enabled, type: boolean, default: true }
              - { name: order, label: Order, type: number }
      - name: contact
        label: Contact
        type: object
        fields:
          - { name: heading, label: Contact heading, type: text }
          - { name: text, label: Contact text, type: text }
          - { name: formEnabled, label: Enable contact form, type: boolean, default: true }
          - { name: recipientEmail, label: Form recipient email, type: string }
          - name: channels
            label: Contact & Social Channels
            type: object
            description: Add Telegram, Facebook, Instagram, TikTok, WhatsApp, LinkedIn, YouTube, Discord, Threads, email, phone or any future platform.
            list:
              collapsible: { collapsed: true, summary: "{label}" }
            fields:
              - { name: label, label: Channel name, type: string, required: true }
              - { name: icon, label: Icon / short symbol, type: string }
              - { name: url, label: Link, type: string }
              - { name: note, label: Username / note, type: string }
              - { name: enabled, label: Enabled, type: boolean, default: true }
              - { name: showInContact, label: Show in Contact, type: boolean, default: true }
              - { name: showInFooter, label: Show in Footer, type: boolean, default: true }
              - { name: newTab, label: Open in new tab, type: boolean, default: true }
      - name: design
        label: Design & Motion
        type: object
        fields:
          - name: theme
            label: Theme
            type: select
            options:
              values:
                - { name: original, label: Original }
                - { name: minimal, label: Minimal }
                - { name: editorial, label: Editorial }
                - { name: dark, label: Dark }
          - name: defaultMode
            label: Default color mode
            type: select
            options:
              values: [light, dark]
          - { name: allowVisitorDarkMode, label: Show Light/Dark switch to visitors, type: boolean }
          - { name: primaryColor, label: Primary text color, type: string }
          - { name: backgroundColor, label: Background color, type: string }
          - { name: surfaceColor, label: Surface color, type: string }
          - { name: accentColor, label: Accent color, type: string }
          - { name: mutedColor, label: Muted text color, type: string }
          - name: animation
            label: Animation style
            type: select
            options:
              values: [none, subtle, strong, slide, fade, zoom]
          - name: animationSpeed
            label: Animation speed
            type: select
            options:
              values: [slow, normal, fast]
      - name: seo
        label: SEO & Sharing
        type: object
        fields:
          - { name: siteTitle, label: Site / Google title, type: string }
          - { name: metaDescription, label: Meta description, type: text }
          - name: socialImage
            label: Default social sharing image
            type: image
            options: { media: media, extensions: [jpg, jpeg, png, webp], rename: safe }
          - { name: canonicalUrl, label: Canonical website URL, type: string }
          - { name: twitterHandle, label: X / Twitter handle, type: string }

  - name: projects
    label: 02 Projects & Videos
    type: file
    path: content/projects.json
    format: json
    fields:
      - name: projects
        label: Projects
        type: object
        list:
          collapsible: { collapsed: true, summary: "{title}" }
        fields:
          - { name: slug, label: Slug, type: string, required: true }
          - { name: title, label: Title, type: string, required: true }
          - { name: category, label: Category, type: string }
          - { name: description, label: Description, type: text }
          - name: thumbnail
            label: Thumbnail
            type: image
            options: { media: media, extensions: [jpg, jpeg, png, webp], rename: safe }
          - name: gallery
            label: Gallery images
            type: image
            list: true
            options: { media: media, extensions: [jpg, jpeg, png, webp], rename: safe }
          - { name: videoUrl, label: Video URL, type: string }
          - { name: views, label: Views, type: string }
          - { name: likes, label: Likes / engagement, type: string }
          - { name: ctaLabel, label: CTA text, type: string }
          - { name: ctaUrl, label: CTA URL, type: string }
          - { name: color, label: Accent color, type: string }
          - { name: featured, label: Featured, type: boolean }
          - { name: published, label: Published, type: boolean, default: true }
          - { name: order, label: Order, type: number }

  - name: blog
    label: 03 Blog
    type: file
    path: content/site.json
    format: json
    fields:
      - name: topics
        label: Categories
        type: object
        list:
          min: 1
          collapsible: { collapsed: true, summary: "{name}" }
        fields:
          - { name: name, label: Category name, type: string, required: true }
          - { name: icon, label: Symbol, type: string }
          - { name: note, label: Description, type: string }
          - { name: color, label: Category color, type: string }
      - name: posts
        label: Blog Posts
        type: object
        description: Add, edit, delete or reorder posts. Reading time is calculated automatically on the website.
        list:
          min: 1
          collapsible: { collapsed: true, summary: "{title}" }
        fields:
          - { name: slug, label: URL slug, type: string, required: true }
          - { name: title, label: Title, type: string, required: true }
          - { name: author, label: Author, type: string, default: Tam Phan }
          - { name: category, label: Category, type: string, required: true }
          - name: date
            label: Published date
            type: date
            options: { format: yyyy-MM-dd }
          - name: updatedDate
            label: Last updated date
            type: date
            options: { format: yyyy-MM-dd }
          - name: status
            label: Status
            type: select
            options:
              values:
                - { name: published, label: Published }
                - { name: draft, label: Draft }
            default: published
          - { name: featured, label: Featured post, type: boolean }
          - { name: excerpt, label: Card summary, type: text, required: true }
          - { name: seoTitle, label: SEO title, type: string }
          - { name: seoDescription, label: SEO description, type: text }
          - name: socialImage
            label: Social sharing image
            type: image
            options: { media: media, extensions: [jpg, jpeg, png, webp], rename: safe }
          - { name: lead, label: Opening sentence, type: text }
          - { name: quote, label: Highlighted quote, type: text }
          - name: tags
            label: Tags
            type: string
            list: true
          - name: content
            label: Article content — text & images
            type: rich-text
            description: Use the image button to upload images anywhere inside the article.
            options:
              format: html
              switcher: true
              media: media
              extensions: [jpg, jpeg, png, webp, gif]
              rename: safe
          - name: body
            label: Legacy paragraphs
            type: text
            list: true
          - name: image
            label: Cover image
            type: image
            options: { media: media, extensions: [jpg, jpeg, png, webp], rename: safe }
          - { name: color, label: Accent color, type: string, description: Enter a hex color such as #f0b99b. }
          - { name: relatedSlugs, label: Manual related post slugs, type: string, list: true, description: Optional. Leave empty for automatic related posts. }

  - name: case_studies
    label: 04 Case Studies
    type: file
    path: content/case-studies.json
    format: json
    fields:
      - name: caseStudies
        label: Case Studies
        type: object
        list:
          collapsible: { collapsed: true, summary: "{title}" }
        fields:
          - { name: slug, label: Slug, type: string, required: true }
          - { name: title, label: Title, type: string, required: true }
          - { name: summary, label: Summary, type: text }
          - { name: challenge, label: Challenge, type: text }
          - { name: research, label: Research, type: text }
          - { name: solution, label: Solution, type: text }
          - { name: result, label: Result, type: text }
          - { name: metrics, label: Metrics / results, type: string, list: true }
          - name: images
            label: Images
            type: image
            list: true
            options: { media: media, extensions: [jpg, jpeg, png, webp], rename: safe }
          - { name: color, label: Accent color, type: string }
          - { name: featured, label: Featured, type: boolean }
          - { name: published, label: Published, type: boolean }
          - { name: order, label: Order, type: number }

  - name: pages
    label: 05 Custom Pages
    type: file
    path: content/pages.json
    format: json
    fields:
      - name: pages
        label: Pages
        type: object
        list:
          collapsible: { collapsed: true, summary: "{title}" }
        fields:
          - { name: slug, label: Slug, type: string, required: true }
          - { name: title, label: Page title, type: string, required: true }
          - { name: excerpt, label: Short description, type: text }
          - name: content
            label: Page content
            type: rich-text
            options:
              format: html
              switcher: true
              media: media
              extensions: [jpg, jpeg, png, webp, gif]
              rename: safe
          - name: image
            label: Header image
            type: image
            options: { media: media, extensions: [jpg, jpeg, png, webp], rename: safe }
          - { name: seoTitle, label: SEO title, type: string }
          - { name: seoDescription, label: SEO description, type: text }
          - name: socialImage
            label: Social image
            type: image
            options: { media: media, extensions: [jpg, jpeg, png, webp], rename: safe }
          - { name: published, label: Published, type: boolean }
          - { name: showInMenu, label: Add to menu, type: boolean }
          - { name: menuLabel, label: Menu label, type: string }
          - { name: order, label: Order, type: number }
